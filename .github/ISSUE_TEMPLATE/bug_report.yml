name: Bug report
description: Report a reproducible problem. Do not report security issues here.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove private information from screenshots, scores and recordings."
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the scene, mode and instrument when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser/version, OS, Node version and commit if running locally"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or audio (optional)
